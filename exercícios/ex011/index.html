<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente diminua o tamanho do seu navegador</p>
    <picture>
        <source 
            media="(max-width: 750px)" 
            srcset="./imagens/imagem-300.jpg" 
            type="image/jpg">
        <source 
            media="(max-width: 1050px)" 
            srcset="./imagens/imagem-700.jpg" 
            type="image/jpg">
        <img src="./imagens/imagem-1000.jpg" alt="Imagem flexível">
    </picture>
</body>
</html>
