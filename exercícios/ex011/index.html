<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mídias em HTML5</title>
</head>
<body>
    <h1>Imagens Dinâmicas</h1>
    <p>Tente abrir este site em vários dispositivos diferentes ou simplesmente diminua o tamanho do seu navegador</p>
    <picture>
        <source 
            media="(max-width: 750px)" 
            srcset="./imagens/imagem-300.jpg" 
            type="image/jpg">
        <source 
            media="(max-width: 1050px)" 
            srcset="./imagens/imagem-700.jpg" 
            type="image/jpg">
        <img src="./imagens/imagem-1000.jpg" alt="Imagem flexível">
    </picture>
    <h1>Reproduzindo aúdio</h1>
    <p>Vamos aprender a reproduzir aúdio em HTML5</p>
    <!-- Compatibilidade - MP3 WAV OGG -->
    <!-- <audio src="midia/grand_project-wonders-of-the-earth-550792.mp3" autoplay controls></audio> -->
     <audio autoplay>
        <source 
            src="midia/grand_project-wonders-of-the-earth-550792.mp3"
            type="audio/mpeg">
        <p>Seu navegador não é compatível, acesse o link para <a href="midia/grand_project-wonders-of-the-earth-550792.mp3">baixar o arquivo</a></p>
     </audio>
</body>
</html>
