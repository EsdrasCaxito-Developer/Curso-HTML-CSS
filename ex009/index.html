<!DOCTYPE html>
<html lang="PT-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Listas</title>
</head>
<body>
    <h1>Trabalhando com listas</h1>
    <h2>Listas ordenadas</h2>
    <!-- 1 - acordar
    2 - ligar para o João
    2 - escovar os dentes
    3 - lavar roupa -->
    <!-- ol - ordered list / li - list item -->
    <ol>
        <li>Acordar</li>
        <li>Ligar para o João</li>
        <li>Tomar café</li>
        <li>Escovar os dentes</li>
    </ol>
    <h2>Listas não ordenadas</h2>
    <!-- ul - unordered list / li - list item -->
    <ul type="circle">
        <li>Pão</li>
        <li>Tomate</li>
        <li>Leite</li>
        <li>Feijão</li>
        <li>Arroz</li>
    </ul>
</body>
</html>
